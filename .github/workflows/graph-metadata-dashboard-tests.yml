name: graph-metadata-dashboard Tests and Lint

on:
  push:
    paths:
      - "graph-metadata-dashboard/**"
      - ".github/workflows/graph-metadata-dashboard-tests.yml"
  pull_request:
    paths:
      - "graph-metadata-dashboard/**"
      - ".github/workflows/graph-metadata-dashboard-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: graph-metadata-dashboard

jobs:
  checks:
    name: Ruff and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          working-directory: graph-metadata-dashboard

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest
